[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri_build = { package = "tauri-build", version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", default-features = false, features = [ "wry" ] }
tauri-plugin-log = "2"
thiserror = "1.0.60"
getrandom = "0.2.14"

[profile.release]
opt-level = 1
codegen-units = 16
lto = false
debug = false
incremental = false
